<html lang="uk">
<head>

  <title>Tak pojďme po česky! | Čajka (A1-A2)</title>

  <style>
    /* ================= CSS VARIABLES & DYNAMIC COLORS ================= */
    :root {
      --unit-light: #ff7675;
      --unit-dark: #d63031;
      --unit-bg: rgba(255, 118, 117, 0.2);
    }

    /* ================= GLASSMORPHISM & CSS RESET ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(73, 160, 255, 0.2), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 94, 98, 0.2), transparent 25%);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      z-index: 2;
    }

    h1 {
      font-size: 2.5rem;
      color: #2c3e50;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .publisher {
      font-size: 1rem;
      color: #7f8c8d;
      font-style: italic;
      margin-top: 5px;
    }

    .level-badge {
      display: inline-block;
      background: linear-gradient(135deg, #0984e3, #6c5ce7);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }

    /* Glass Container */
    .glass-container {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      width: 100%;
      max-width: 1250px;
      display: flex;
      overflow: hidden;
      min-height: 75vh;
    }

    /* Sidebar (Units) */
    .sidebar {
      width: 270px;
      background: rgba(255, 255, 255, 0.3);
      border-right: 1px solid rgba(255, 255, 255, 0.5);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #636e72;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .unit-btn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 1rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      transition: all 0.3s ease;
      color: #2c3e50;
    }

    .unit-btn:hover, .unit-btn.active {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transform: translateY(-2px);
    }

    /* Color coding for Units */
    .unit-btn[data-unit="unit1"] { border-left: 5px solid #ff7675; }
    .unit-btn[data-unit="unit2"] { border-left: 5px solid #74b9ff; }
    .unit-btn[data-unit="unit3"] { border-left: 5px solid #55efc4; }
    .unit-btn[data-unit="unit4"] { border-left: 5px solid #a29bfe; }
    .unit-btn[data-unit="unit5"] { border-left: 5px solid #fdcb6e; }
    .unit-btn[data-unit="unit6"] { border-left: 5px solid #e84393; }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 80vh;
    }

    .topic-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .topic-btn {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .topic-btn:hover, .topic-btn.active {
      background: var(--unit-light);
      color: white;
      border-color: var(--unit-light);
    }

    /* Content Area Styles */
    .content-area {
      flex: 1;
    }

    .topic-header h2 { margin-bottom: 0.5rem; color: #2d3436; font-size: 1.8rem; }
    .topic-header p { margin-bottom: 1.5rem; color: #636e72; line-height: 1.6; font-size: 1.05rem; }

    .bubble-card {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 15px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .bubble-card h3 { 
      margin-bottom: 1rem; 
      color: var(--unit-dark); 
      transition: color 0.3s;
      font-size: 1.3rem;
      border-bottom: 2px solid var(--unit-bg);
      padding-bottom: 8px;
    }
    .bubble-card p, .bubble-card ul { margin-bottom: 1rem; line-height: 1.7; font-size: 1rem; }
    .bubble-card ul { margin-left: 1.5rem; }
    .bubble-card li { margin-bottom: 6px; }

    /* Vocabulary Grid */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .vocab-item {
      background: rgba(255,255,255,0.85);
      padding: 1.1rem;
      border-radius: 12px;
      text-align: center;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid rgba(255,255,255,0.9);
    }

    .vocab-cz { font-weight: bold; font-size: 1.15rem; color: #2d3436; }
    .vocab-uk { font-size: 0.92rem; color: #636e72; margin-top: 6px; }
    .tag { 
      position: absolute; top: -8px; right: -8px; 
      background: #e17055; color: white; 
      font-size: 0.65rem; padding: 3px 7px; border-radius: 8px; font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* Grammar Tables */
    .grammar-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      overflow: hidden;
    }
    .grammar-table th, .grammar-table td {
      border: 1px solid rgba(0,0,0,0.08);
      padding: 0.85rem;
      text-align: left;
    }
    .grammar-table th { 
      background: var(--unit-bg); 
      transition: background-color 0.3s;
      color: #2d3436;
      font-weight: bold;
    }

    /* Finish Button */
    .finish-btn {
      display: block;
      width: 100%;
      padding: 1.1rem;
      background: linear-gradient(135deg, var(--unit-light), var(--unit-dark));
      color: white;
      text-align: center;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 2rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    .finish-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }

    /* Quiz Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 10;
    }
    .modal-content {
      background: white; border-radius: 20px; padding: 2.5rem; width: 90%; max-width: 650px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; position: relative;
    }
    .close-modal {
      position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #aaa;
    }
  </style>
</head>

    // ================= SCRIPT LOGIC =================
    let currentUnit = 'unit1';

    const unitColors = {
      'unit1': { light: '#ff7675', dark: '#d63031', bg: 'rgba(255, 118, 117, 0.2)' },
      'unit2': { light: '#74b9ff', dark: '#0984e3', bg: 'rgba(116, 185, 255, 0.2)' },
      'unit3': { light: '#55efc4', dark: '#00b894', bg: 'rgba(85, 239, 196, 0.2)' },
      'unit4': { light: '#a29bfe', dark: '#6c5ce7', bg: 'rgba(162, 155, 254, 0.2)' },
      'unit5': { light: '#fdcb6e', dark: '#e17055', bg: 'rgba(253, 203, 110, 0.2)' },
      'unit6': { light: '#fd79a8', dark: '#e84393', bg: 'rgba(253, 121, 168, 0.2)' }
    };

    function initApp() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '<div class="sidebar-title">Структура курсу</div>';
      
      for (let i = 1; i <= 6; i++) {
        let btn = document.createElement('button');
        btn.className = 'unit-btn';
        btn.setAttribute('data-unit', 'unit' + i);
        btn.innerText = unitsData['unit' + i].title;
        btn.onclick = () => loadUnit('unit' + i);
        sidebar.appendChild(btn);
      }
      loadUnit('unit1');
    }

    function loadUnit(unitId) {
      if(!unitsData[unitId]) return;
      currentUnit = unitId;

      if (unitColors[unitId]) {
        document.documentElement.style.setProperty('--unit-light', unitColors[unitId].light);
        document.documentElement.style.setProperty('--unit-dark', unitColors[unitId].dark);
        document.documentElement.style.setProperty('--unit-bg', unitColors[unitId].bg);
      }

      document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector('.unit-btn[data-unit="' + unitId + '"]');
      if(activeBtn) activeBtn.classList.add('active');

      const topicNav = document.getElementById('topic-nav');
      topicNav.innerHTML = '';
      
      const topics = unitsData[unitId].topics;
      for (const topicKey in topics) {
        let btn = document.createElement('button');
        btn.className = 'topic-btn';
        btn.innerText = topics[topicKey].title.split(' ')[0];
        btn.onclick = () => loadTopic(unitId, topicKey, btn);
        topicNav.appendChild(btn);
      }

      if (topicNav.firstChild) {
        topicNav.firstChild.click();
      }
    }

    function loadTopic(unitId, topicId, btnElement) {
      document.querySelectorAll('.topic-btn').forEach(btn => btn.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');

      const contentArea = document.getElementById('content-area');
      if(unitsData[unitId] && unitsData[unitId].topics[topicId]) {
        contentArea.innerHTML = unitsData[unitId].topics[topicId].content;
      }
    }

    function openQuiz() {
      document.getElementById('quiz-modal').style.display = 'flex';
    }

    function closeQuiz() {
      document.getElementById('quiz-modal').style.display = 'none';
    }

    window.onload = initApp;
  </script>
